name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/cinema-frontend-v1/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/cinema-frontend-v1/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cinema-frontend-v1
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/cinema-frontend-v1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
