name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/cinema-frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
  push:
    branches: [main]
    paths:
      - "apps/cinema-frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cinema-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/cinema-frontend/package-lock.json
      - name: Use npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
